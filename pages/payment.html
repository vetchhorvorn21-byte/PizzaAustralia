<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <link rel="stylesheet" href="../css/payment.css">
</head>
<body>

<div class="payment-card">

    <h1>💳 ABA KHQR Payment</h1>

    <div class="amount-box">

        <p>Total Amount</p>

        <h2 id="totalPrice">
            $20.98
        </h2>

    </div>

    <img
        src="../images/qr.png"
        class="qr-image"
    >

    <p class="scan-text">
        Scan QR Code To Complete Payment
    </p>

    <button id="successBtn">
        Payment Completed
    </button>

</div>

<script src="../js/payment.js"></script>

</body>
</html>
